<!doctype html>
<html lang="en" data-theme="ember" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blade Launcher</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/blade.css">
<style>
  body{overflow:hidden}
  .shell{position:fixed;inset:0;display:flex;background:var(--bg0)}
  .shell.top{flex-direction:column}

  /* ---- brand ---- */
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand img{width:38px;height:38px;filter:drop-shadow(0 3px 8px rgba(255,138,30,.45))}
  .brand .bw{display:flex;flex-direction:column;line-height:1}
  .brand .bw b{font-family:var(--dp);font-weight:700;font-size:21px;letter-spacing:.06em}
  .brand .bw span{font-family:var(--dp);font-weight:500;font-size:9.5px;letter-spacing:.44em;color:var(--dim2);margin-top:3px}

  /* ---- SIDEBAR mode ---- */
  .nav{flex:0 0 auto;background:linear-gradient(180deg,var(--bg1),var(--bg0));position:relative;z-index:3}
  .shell.side .nav{width:248px;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px}
  .shell.side .nav .brand{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .shell.side .items{display:flex;flex-direction:column;gap:5px}
  .shell.side .nb{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:0;background:none;
    cursor:pointer;border-radius:9px;color:var(--dim);font-size:14.5px;font-weight:500;text-align:left;position:relative}
  .shell.side .nb svg{width:19px;height:19px;color:var(--or);flex:0 0 auto}
  .shell.side .nb:hover{background:rgba(127,127,127,.12);color:var(--ink)}
  .shell.side .nb.on{color:#241200;background:linear-gradient(90deg,var(--or),var(--or3))}
  .shell.side .nb.on svg{color:#241200}
  .shell.side .navfoot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);
    font-family:var(--dp);font-style:italic;font-weight:700;line-height:1.1}
  .shell.side .navfoot .a{font-size:11px;color:var(--dim2)}
  .shell.side .navfoot .b{font-size:15px;color:var(--or)}

  /* ---- TOPBAR mode ---- */
  .shell.top .nav{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 18px}
  .shell.top .nav .brand{padding-right:20px;position:relative}
  .shell.top .nav .brand::after{content:"";position:absolute;right:4px;top:10px;bottom:10px;width:3px;
    background:linear-gradient(180deg,transparent,var(--or),transparent);transform:skewX(-16deg)}
  .shell.top .items{display:flex;align-items:center;gap:4px;flex:1}
  .shell.top .nb{display:flex;align-items:center;gap:9px;height:44px;padding:0 17px;border:0;background:none;
    cursor:pointer;border-radius:8px;color:var(--dim);font-size:14.5px;font-weight:500;position:relative}
  .shell.top .nb svg{width:18px;height:18px;color:var(--or)}
  .shell.top .nb:hover{color:var(--ink);background:rgba(127,127,127,.1)}
  .shell.top .nb.on{color:var(--or2);background:none}
  .shell.top .nb.on::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,var(--or3),var(--or2));box-shadow:0 0 12px rgba(255,138,30,.6)}
  .shell.top .navfoot{display:none}

  /* ---- page frame ---- */
  .body{flex:1;min-width:0;min-height:0;position:relative;background:var(--bg0)}
  iframe.page{width:100%;height:100%;border:0;display:block;background:var(--bg0)}
  .ldr{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg0);z-index:2;transition:opacity .25s}
  .ldr.hide{opacity:0;pointer-events:none}
  .spin{width:44px;height:44px;position:relative}
  .spin::before,.spin::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
  .spin::before{border-top-color:var(--or);border-right-color:var(--or2);animation:sp 1s linear infinite}
  .spin::after{inset:8px;border-bottom-color:var(--or3);animation:sp 1.6s linear infinite reverse}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- game stage (full window, over everything) ---- */
  .stage{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#000}
  .stage.show{display:flex}
  .sbar{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 14px;
    background:linear-gradient(180deg,#0c0e12,#07080b);border-bottom:1px solid #2a2e36;transition:opacity .3s}
  .sbar.dim{opacity:.26}
  .sbar:hover{opacity:1}
  .back{display:flex;align-items:center;gap:9px;height:32px;padding:0 15px 0 11px;cursor:pointer;border-radius:6px;
    color:#fff;background:rgba(255,255,255,.07);border:1px solid #2a2e36;
    font-family:var(--dp);font-weight:600;font-size:13px;letter-spacing:.06em}
  .back:hover{border-color:var(--or);color:var(--or2)}
  .back svg{width:15px;height:15px}
  .snow{flex:1;display:flex;align-items:baseline;gap:9px;min-width:0}
  .snow .n{font-family:var(--dp);font-weight:600;font-size:15px;color:var(--or2)}
  .snow .s{font-size:11.5px;color:#6a707a}
  .ib{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid #2a2e36;
    border-radius:6px;color:#8b929c;cursor:pointer}
  .ib:hover{color:#fff;border-color:var(--or)}
  .ib svg{width:15px;height:15px}
  .fw{position:relative;flex:1;background:#000}
  iframe#game{width:100%;height:100%;border:0;display:block;background:#000}
  .ov{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;z-index:2;
    background:radial-gradient(90% 80% at 50% 40%,#14161d,#06080b);color:#fff}
  .ov.show{display:grid}
  .ov h3{font-family:var(--dp);font-weight:700;font-size:20px;margin:16px 0 8px}
  .ov p{color:#aeb5bf;font-size:13.5px;max-width:46ch;margin:0 auto;line-height:1.55}
  .ov .fn{font-family:var(--dp);color:var(--or2)}
  .bar{width:min(340px,70vw);height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin:20px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:35%;border-radius:6px;background:linear-gradient(90deg,var(--or3),var(--or2));
    animation:sl 1.4s ease-in-out infinite}
  @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
  .ov.err h3{color:#ff6b6b}
  .ov.err .spin,.ov.err .bar{display:none}
  .rt{margin-top:20px;display:none;gap:10px;justify-content:center;flex-wrap:wrap}
  .ov.err .rt{display:flex}
  .rt button{font-family:var(--dp);font-weight:600;font-size:13px;padding:9px 18px;border-radius:6px;cursor:pointer;
    color:#fff;background:rgba(255,255,255,.08);border:1px solid #2a2e36}
  .rt button:hover{border-color:var(--or)}

  @media (max-width:820px){
    .shell.side{flex-direction:column}
    .shell.side .nav{width:auto;border-right:0;border-bottom:1px solid var(--line);
      flex-direction:row;align-items:center;gap:14px;padding:10px 14px;overflow-x:auto}
    .shell.side .nav .brand{padding:0 12px 0 0;border-bottom:0;margin:0;border-right:1px solid var(--line)}
    .shell.side .items{flex-direction:row;gap:4px}
    .shell.side .nb{height:40px;padding:0 12px;white-space:nowrap}
    .shell.side .navfoot{display:none}
    .nb .lb{display:none}
  }
</style>
</head>
<body>
<div class="shell side" id="shell">
  <nav class="nav">
    <a class="brand" href="#" id="brandHome"><img src="assets/logo.png" alt=""><span class="bw"><b>BLADE</b><span>LAUNCHER</span></span></a>
    <div class="items" id="items"></div>
    <div class="navfoot"><div class="a">PLAY YOUR WAY.</div><div class="b">BLADE LAUNCHER.</div></div>
  </nav>
  <div class="body">
    <div class="ldr" id="ldr"><div class="spin"></div></div>
    <iframe class="page" id="page" title="Blade page"
      allow="fullscreen; pointer-lock; gamepad; autoplay; clipboard-read; clipboard-write; accelerometer; gyroscope; microphone; camera"
      allowfullscreen></iframe>
  </div>
</div>

<!-- full-window game stage -->
<section class="stage" id="stage" aria-hidden="true">
  <div class="sbar" id="sbar">
    <button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>BLADE</button>
    <div class="snow"><span class="n" id="nn">&mdash;</span><span class="s" id="ns"></span></div>
    <button class="ib" id="rl" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
    <button class="ib" id="fs" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
  <div class="fw">
    <div class="ov" id="ov"><div>
      <div class="spin" style="margin:0 auto"></div>
      <h3 id="ovT">Loading</h3>
      <p id="ovM"></p>
      <div class="bar"><i></i></div>
      <div class="rt"><button id="rtry">Try again</button><button id="ovB">Back to launcher</button></div>
    </div></div>
    <iframe id="game" title="Eaglercraft client"
      allow="fullscreen; pointer-lock; gamepad; autoplay; clipboard-read; clipboard-write; accelerometer; gyroscope; microphone; camera"
      allowfullscreen></iframe>
  </div>
</section>

<script>
(function(){
 "use strict";
 var $=function(i){return document.getElementById(i);};

 var PAGES=[
  {id:"home",    file:"home.html",    label:"Home",
   icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-2.5v9h-5v-6h-3v6h-5v-9H3z"/></svg>'},
  {id:"custom",  file:"custom.html",  label:"Custom Clients",
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1 5 5L21 12l-3 3-6-6 3-3z"/><path d="M12 9L4 17v3h3l8-8"/></svg>'},
  {id:"packs",   file:"packs.html",   label:"Resource Packs",
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>'},
  {id:"settings",file:"settings.html",label:"Settings",
   icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4c0-.5 0-1-.1-1.4l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.4-1.4L16.2 2H7.8l-.3 2.8A7.6 7.6 0 0 0 5.1 6.2l-2.4-1-2 3.4 2 1.6a8 8 0 0 0 0 2.8l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.4 1.4l.3 2.8h8.4l.3-2.8a7.6 7.6 0 0 0 2.4-1.4l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.4z"/></svg>'},
  {id:"about",   file:"about.html",   label:"About",
   icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>'}
 ];

 /* ---------- settings (shared with pages via postMessage) ---------- */
 var S={theme:"ember",mode:"dark",nav:"side",dimbar:true,fslaunch:false};
 function load(){ try{ var r=localStorage.getItem("blade.settings"); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){} }
 function save(){ try{ localStorage.setItem("blade.settings",JSON.stringify(S)); }catch(e){} }
 function applyLocal(){
   document.documentElement.setAttribute("data-theme",S.theme);
   document.documentElement.setAttribute("data-mode",S.mode);
   $("shell").className="shell "+(S.nav==="top"?"top":"side");
 }
 function pushToPage(){
   var w=$("page").contentWindow; if(!w) return;
   try{ w.postMessage({type:"blade:settings",settings:S},"*"); }catch(e){}
 }
 load(); applyLocal();

 /* ---------- nav ---------- */
 var cur="home";
 PAGES.forEach(function(p){
   var b=document.createElement("button");
   b.className="nb"+(p.id===cur?" on":"");
   b.dataset.id=p.id;
   b.innerHTML=p.icon+'<span class="lb">'+p.label+'</span>';
   b.addEventListener("click",function(){go(p.id);});
   $("items").appendChild(b);
 });
 function go(id){
   var p=PAGES.filter(function(x){return x.id===id;})[0]; if(!p) return;
   cur=id;
   [].forEach.call($("items").children,function(c){c.classList.toggle("on",c.dataset.id===id);});
   $("ldr").classList.remove("hide");
   $("page").src=p.file;
 }
 $("brandHome").addEventListener("click",function(e){e.preventDefault();go("home");});
 $("page").addEventListener("load",function(){
   $("ldr").classList.add("hide");
   pushToPage();
   try{ $("page").contentWindow.focus(); }catch(e){}
 });
 go("home");

 /* ---------- messages from pages ---------- */
 window.addEventListener("message",function(e){
   var d=e.data||{};
   if(d.type==="blade:launch" && d.url){ launch(d.url,d.name,d.meta); }
   else if(d.type==="blade:settings-change"){
     S=Object.assign(S,d.settings||{}); save(); applyLocal(); pushToPage();
   }
   else if(d.type==="blade:navigate" && d.page){ go(d.page); }
   else if(d.type==="blade:get-settings"){ pushToPage(); }
 });

 /* ---------- game stage ---------- */
 var stage=$("stage"),game=$("game"),ov=$("ov"),sbar=$("sbar"),bt=null,lastURL="",lastName="";
 function launch(url,name,meta){
   lastURL=url; lastName=name||"Client";
   $("nn").textContent="Blade "+lastName;
   $("ns").textContent=meta||"";
   $("ovT").innerHTML="Loading <span class='fn'>"+lastName+"</span>";
   $("ovM").textContent="Big client \u2014 the first load can take a moment on slower machines.";
   ov.className="ov show";
   stage.classList.add("show"); stage.setAttribute("aria-hidden","false");
   game.src=url;
   if(S.dimbar) dim();
 }
 game.addEventListener("load",function(){
   if((game.src||"").indexOf("about:blank")>=0) return;
   ov.classList.remove("show");
   focusGame(); setTimeout(focusGame,300);
   if(S.fslaunch){ try{ document.querySelector(".fw").requestFullscreen(); }catch(e){} }
 });
 game.addEventListener("error",function(){
   ov.className="ov show err";
   $("ovT").textContent="Couldn't load "+lastName;
   $("ovM").textContent="That client file didn't load. Check your connection and try again.";
 });
 function focusGame(){ try{game.focus();}catch(e){} try{ if(game.contentWindow) game.contentWindow.focus(); }catch(e){} }
 function home(){
   clearTimeout(bt); game.src="about:blank";
   stage.classList.remove("show"); stage.setAttribute("aria-hidden","true"); sbar.classList.remove("dim");
   try{ $("page").contentWindow.focus(); }catch(e){}
 }
 $("bk").addEventListener("click",home);
 $("ovB").addEventListener("click",home);
 $("rtry").addEventListener("click",function(){ launch(lastURL,lastName,$("ns").textContent); });
 $("rl").addEventListener("click",function(){ ov.className="ov show"; game.src=game.src; });
 $("fs").addEventListener("click",function(){
   var e=document.querySelector(".fw");
   document.fullscreenElement?document.exitFullscreen():(e.requestFullscreen&&e.requestFullscreen());
 });
 document.querySelector(".fw").addEventListener("mousedown",focusGame);
 function dim(){ clearTimeout(bt); bt=setTimeout(function(){ sbar.classList.add("dim"); },3500); }
 ["mousemove","keydown"].forEach(function(ev){
   stage.addEventListener(ev,function(){ sbar.classList.remove("dim"); if(S.dimbar) dim(); });
 });
})();
</script>
</body>
</html>
